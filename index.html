<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsDoggy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #111b21;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .phone-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background: #0b141a;
            display: flex;
            flex-direction: column;
            border-radius: 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        @media (min-width: 401px) {
            .phone-container {
                height: 90vh;
                border-radius: 20px;
            }
        }
        .chat-header {
            background: #202c33;
            color: #e9edef;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .chat-avatar {
            width: 40px;
            height: 40px;
            background: #00a884;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .chat-info h3 {
            font-size: 16px;
        }
        .chat-messages {
            flex: 1;
            background: #0efe2; /* фоновый узор имитируется цветом */
            background-color: #0b141a;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            color: #e9edef;
            word-wrap: break-word;
        }
        .message.incoming {
            background: #202c33;
            align-self: flex-start;
        }
        .message.outgoing {
            background: #005c4b;
            align-self: flex-end;
        }
        .chat-input-area {
            background: #202c33;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .chat-input-area input[type="text"] {
            flex: 1;
            background: #2a3942;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            color: #e9edef;
            outline: none;
            font-size: 14px;
        }
        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #8696a0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon:hover {
            color: #e9edef;
        }
        .send-btn {
            background: #00a884;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #qr-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111b21;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 20px;
        }
        #qr-overlay img {
            width: 250px;
            height: 250px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- Экран QR-кода -->
        <div id="qr-overlay">
            <h2>Авторизация WhatsApp</h2>
            <p style="margin-bottom: 20px; color: #8696a0;">Сканируйте QR-код в приложении WhatsApp</p>
            <img id="qr-img" src="" alt="Загрузка QR-кода...">
        </div>

        <!-- Шапка чата -->
        <div class="chat-header">
            <div class="chat-avatar">Г</div>
            <div class="chat-info">
                <h3>Глеб</h3>
                <span style="font-size: 12px; color: #8696a0;" id="status-text">Подключение...</span>
            </div>
        </div>

        <!-- Список сообщений -->
        <div class="chat-messages" id="messages"></div>

        <!-- Панель ввода -->
        <div class="chat-input-area">
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            
            <button class="btn-icon" onclick="document.getElementById('image-input').click()" title="Отправить фото">📷</button>
            <button class="btn-icon" id="mic-btn" title="Записать голосовое">🎤</button>
            
            <input type="text" id="message-input" placeholder="Сообщение" onkeydown="if(event.key === 'Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const targetNumber = "77055553333"; // Замени на нужный номер, если требуется
        
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        socket.on('qr_code', (url) => {
            document.getElementById('qr-img').src = url;
            document.getElementById('qr-overlay').style.display = 'flex';
        });

        socket.on('connection_status', (data) => {
            if (data.connected) {
                document.getElementById('qr-overlay').style.display = 'none';
                document.getElementById('status-text').innerText = 'В сети';
            } else {
                document.getElementById('status-text').innerText = 'Ожидание сканирования QR';
            }
        });

        socket.on('new_message', (data) => {
            appendMessage(data.text, data.fromMe ? 'outgoing' : 'incoming', data.type);
        });

        function appendMessage(text, typeClass, msgType) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${typeClass}`;
            
            if (msgType === 'image') {
                div.innerHTML = `<img src="${text}" style="max-width:100%; border-radius:5px;">`;
            } else if (msgType === 'audio') {
                div.innerHTML = `<audio controls src="${text}" style="max-width:200px;"></audio>`;
            } else {
                div.innerText = text;
            }
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            fetch('/api/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ number: targetNumber, message: text })
            }).then(res => {
                if (res.ok) {
                    appendMessage(text, 'outgoing', 'text');
                    input.value = '';
                }
            });
        }

        // Отправка фото
        document.getElementById('image-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Image = event.target.result;
                fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number: targetNumber, media: base64Image, type: 'image', message: 'Фото' })
                }).then(res => {
                    if (res.ok) appendMessage(base64Image, 'outgoing', 'image');
                });
            };
            reader.readAsDataURL(file);
        });

        // Запись голосовых
        const micBtn = document.getElementById('mic-btn');
        micBtn.onclick = async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            const base64Audio = event.target.result;
                            fetch('/api/send', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ number: targetNumber, media: base64Audio, type: 'audio' })
                            }).then(res => {
                                if (res.ok) appendMessage(base64Audio, 'outgoing', 'audio');
                            });
                        };
                        reader.readAsDataURL(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.style.color = '#00a884'; // Подсветка кнопки записи
                } catch (err) {
                    alert('Нет доступа к микрофону!');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.style.color = '#8696a0';
            }
        };

        socket.emit('check_status');
    </script>
</body>
</html>
