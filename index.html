<script>
    const socket = io();
    let activeChatPhone = null;
    let chatsMap = new Map();
    let savedContacts = JSON.parse(localStorage.getItem('saved_contacts') || '[]');
    let myProfile = { name: "User", status: "В сети WhatsDoggy" };
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    socket.on('connect', () => {
        console.log('✅ Успешное соединение с сокетом!');
    });

    // Функция СТРОГОЙ очистки: возвращает ТОЛЬКО ЦИФРЫ
    function cleanPhoneNumber(rawPhone) {
        if (!rawPhone) return '';
        let cleaned = String(rawPhone).split('@')[0].split(':')[0].replace(/\D/g, '');
        if (cleaned.startsWith('8') && cleaned.length === 11) {
            cleaned = '7' + cleaned.slice(1);
        } else if (cleaned.length === 10) {
            cleaned = '7' + cleaned;
        }
        return cleaned; // Только цифры! Никаких @s.whatsapp.net
    }

    socket.on('qr', (data) => {
        const qrImg = document.getElementById('qr-image');
        const loader = document.getElementById('qr-loader');
        if (data.qr) {
            qrImg.src = data.qr;
            qrImg.style.display = 'block';
            loader.style.display = 'none';
        }
    });

    socket.on('ready', () => {
        document.getElementById('qr-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'flex';
        saveAndRenderContacts();
    });

    socket.on('message', (msg) => {
        console.log('📩 Получено новое сообщение:', msg);

        // Гарантируем чистые цифры
        let phone = cleanPhoneNumber(msg.from);
        if (!phone) return;

        if (!chatsMap.has(phone)) {
            let contact = savedContacts.find(c => c.phone === phone);
            chatsMap.set(phone, {
                name: contact ? contact.name : phone,
                phone: phone,
                messages: []
            });
        }

        let chat = chatsMap.get(phone);
        chat.messages.push({
            text: msg.text,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            fromMe: false,
            type: msg.type || 'text'
        });

        renderChats();
        if (activeChatPhone === phone) {
            renderMessages(phone);
        }
    });

    function switchTab(tabId, el) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        if (el) el.classList.add('active');
    }

    function handleFabClick() {
        let phoneInput = prompt('Введите номер телефона (+7...):');
        if (!phoneInput) return;
        
        let cleanPhone = cleanPhoneNumber(phoneInput);
        if (!cleanPhone) {
            alert('Некорректный номер!');
            return;
        }

        let nameInput = prompt('Введите имя контакта:', 'Контакт');
        if (!nameInput) nameInput = cleanPhone;

        if (!savedContacts.some(c => c.phone === cleanPhone)) {
            savedContacts.push({ name: nameInput, phone: cleanPhone });
            saveAndRenderContacts();
        }

        openChat(cleanPhone);
    }

    function saveAndRenderContacts() {
        localStorage.setItem('saved_contacts', JSON.stringify(savedContacts));
        renderContacts();
    }

    function renderChats() {
        const container = document.getElementById('chats-list-container');
        container.innerHTML = '';
        chatsMap.forEach((chat, phone) => {
            let lastMsg = chat.messages[chat.messages.length - 1];
            let lastText = lastMsg ? (lastMsg.type === 'image' ? '📷 Изображение' : lastMsg.type === 'audio' ? '🎵 Голосовое сообщение' : lastMsg.text) : 'Нет сообщений';
            
            let div = document.createElement('div');
            div.className = 'chat-item';
            div.onclick = () => openChat(phone);
            div.innerHTML = `
                <div class="avatar">${chat.name.charAt(0).toUpperCase()}</div>
                <div class="chat-info">
                    <div class="chat-header">
                        <span class="chat-name">${chat.name}</span>
                        <span class="chat-time">${lastMsg ? lastMsg.time : ''}</span>
                    </div>
                    <div class="chat-last-msg">${lastMsg && lastMsg.fromMe ? '<span class="ticks">✓✓</span>' : ''} ${lastText}</div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function renderContacts() {
        const container = document.getElementById('contacts-list-container');
        container.innerHTML = '';
        savedContacts.forEach(contact => {
            let div = document.createElement('div');
            div.className = 'setting-item';
            div.onclick = () => openChat(contact.phone);
            div.innerHTML = `
                <div class="avatar" style="width:40px; height:40px; font-size:16px;">${contact.name.charAt(0).toUpperCase()}</div>
                <div>
                    <div class="setting-title">${contact.name}</div>
                    <div class="setting-sub">${contact.phone}</div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function openChat(phone) {
        phone = cleanPhoneNumber(phone);
        activeChatPhone = phone;
        let chat = chatsMap.get(phone);
        if (!chat) {
            let contact = savedContacts.find(c => c.phone === phone);
            chat = {
                name: contact ? contact.name : phone,
                phone: phone,
                messages: []
            };
            chatsMap.set(phone, chat);
        }
        document.getElementById('active-chat-name').innerText = chat.name;
        document.getElementById('active-chat-avatar').innerText = chat.name.charAt(0).toUpperCase();
        document.getElementById('chat-window').style.display = 'flex';
        renderMessages(phone);
    }

    function closeChat() {
        document.getElementById('chat-window').style.display = 'none';
        activeChatPhone = null;
        renderChats();
    }

    function openProfile() { document.getElementById('profile-screen').style.display = 'flex'; }
    function closeProfile() {
        document.getElementById('profile-screen').style.display = 'none';
        myProfile.name = document.getElementById('profile-name-input').value;
        myProfile.status = document.getElementById('profile-status-input').value;
        document.getElementById('settings-my-name').innerText = myProfile.name;
        document.getElementById('settings-my-status').innerText = myProfile.status;
    }

    function renderMessages(phone) {
        const container = document.getElementById('chat-messages-container');
        container.innerHTML = '';
        let chat = chatsMap.get(phone);
        if (!chat) return;

        chat.messages.forEach(msg => {
            let bubble = document.createElement('div');
            bubble.className = `msg-bubble ${msg.fromMe ? 'msg-outgoing' : 'msg-incoming'}`;
            
            let contentHtml = '';
            if (msg.type === 'image') {
                contentHtml = `<img src="${msg.text}" alt="image">`;
            } else if (msg.type === 'audio') {
                contentHtml = `<audio controls src="${msg.text}"></audio>`;
            } else {
                contentHtml = `<span>${msg.text}</span>`;
            }

            bubble.innerHTML = `
                ${contentHtml}
                <span class="msg-time">${msg.time} ${msg.fromMe ? '<span class="ticks">✓✓</span>' : ''}</span>
            `;
            container.appendChild(bubble);
        });
        container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text || !activeChatPhone) return;

        // Отправляем СТРОГО чистые цифры на сервер
        const cleanTo = cleanPhoneNumber(activeChatPhone);

        console.log('🚀 Отправка сообщения сокету:', { to: cleanTo, text: text });
        socket.emit('send_message', { to: cleanTo, text: text, type: 'text' });

        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const chat = chatsMap.get(cleanTo);
        if (chat) {
            chat.messages.push({ text: text, time: timeStr, fromMe: true, type: 'text' });
        }

        input.value = '';
        renderMessages(cleanTo);
        renderChats();
    }

    function handleImageUpload(event) {
        if (!activeChatPhone) {
            alert('Сначала выберите чат!');
            event.target.value = '';
            return;
        }

        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Image = e.target.result;
            const cleanTo = cleanPhoneNumber(activeChatPhone);
            socket.emit('send_message', { to: cleanTo, text: base64Image, type: 'image' });
            
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            let chat = chatsMap.get(cleanTo);
            if (chat) {
                chat.messages.push({ text: base64Image, time: timeStr, fromMe: true, type: 'image' });
            }
            renderMessages(cleanTo);
            renderChats();
            event.target.value = '';
        };
        reader.readAsDataURL(file);
    }

    async function handleMicClick() {
        if (!activeChatPhone) {
            alert('Сначала выберите чат!');
            return;
        }

        const micBtn = document.getElementById('mic-send-btn');
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                
                mediaRecorder.onstop = () => {
                    const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 
                                     (MediaRecorder.isTypeSupported('audio/mp3') ? 'audio/mp3' : 'audio/ogg');
                    
                    const blob = new Blob(audioChunks, { type: mimeType });
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const base64Audio = e.target.result;
                        const cleanTo = cleanPhoneNumber(activeChatPhone);
                        
                        socket.emit('send_message', { to: cleanTo, text: base64Audio, type: 'audio' });
                        
                        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        let chat = chatsMap.get(cleanTo);
                        if (chat) {
                            chat.messages.push({ text: base64Audio, time: timeStr, fromMe: true, type: 'audio' });
                        }
                        renderMessages(cleanTo);
                        renderChats();
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording-indicator');
            } catch (e) {
                alert('Ошибка доступа к микрофону');
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            micBtn.classList.remove('recording-indicator');
        }
    }
</script>
